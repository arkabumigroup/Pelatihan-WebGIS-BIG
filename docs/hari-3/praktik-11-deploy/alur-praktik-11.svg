<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img"
     aria-labelledby="t d"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Alur Praktik 11, dari titik mulai sampai hasil akhir</title>
  <desc id="d">Peserta mulai dari fork repositori dan menyiapkan database Supabase, termasuk membuat akun super admin. Di laptop, peserta mengisi berkas .env dan menguji portal. Di VM, peserta menyalin repositori dan menghubungkan Cloud Build. Setelah itu satu perintah git push memicu Cloud Build untuk membangun image dan menyalakan container, sehingga Geoportal terbit di alamat HTTPS bersama GeoServer.</desc>

  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a8b9e"/>
    </marker>
  </defs>

  <style>
    /* Warna ditulis tetap, bukan currentColor. Diagram ini dimuat lewat tag img,
       sehingga menjadi dokumen terpisah dan tidak mewarisi warna halaman.
       Dengan warna tetap, diagram terbaca sama di mode terang maupun gelap. */
    .latar { fill: #ffffff; }
    .kartu { fill: #f4f6f9; stroke: #c9d2dd; stroke-width: 1.2; }
    .sorot { fill: #fdf1e3; stroke: #b45309; stroke-width: 1.8; }
    .hasil { fill: #eef2f7; stroke: #7a8b9e; stroke-width: 1.6; }
    .alir  { stroke: #7a8b9e; stroke-width: 1.6; fill: none; marker-end: url(#p); }
    .poros { stroke: #dde3ea; stroke-width: 1; }
    .judul { fill: #003060; font-size: 13.5px; font-weight: 600; }
    .isi   { fill: #46566b; font-size: 12px; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .tahap { fill: #7a8b9e; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; }
  </style>

  <rect class="latar" x="0" y="0" width="760" height="920" rx="10"/>

  <!-- Kolom kiri: penanda tempat pekerjaan berlangsung -->
  <text class="tahap" x="16" y="58">PERSIAPAN</text>
  <text class="tahap" x="16" y="322">UJI DI LAPTOP</text>
  <text class="tahap" x="16" y="510">PASANG DI VM</text>
  <text class="tahap" x="16" y="726">OTOMATIS</text>
  <text class="tahap" x="16" y="896">HASIL</text>
  <line class="poros" x1="100" y1="24" x2="100" y2="918"/>

  <!-- 1 -->
  <rect class="kartu" x="120" y="24" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="50">Fork repositori peserta</text>
  <text class="isi mono" x="140" y="72">github.com/dhanyyudi/personal-geoportal-peserta</text>

  <path class="alir" d="M430 86 V 108"/>

  <!-- 2, titik fokus pertama -->
  <rect class="sorot" x="120" y="108" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="134">Siapkan database Supabase</text>
  <text class="isi" x="140" y="156">Jalankan sql/01-schema.sql lewat SQL Editor</text>

  <path class="alir" d="M430 170 V 192"/>

  <!-- 3, titik fokus kedua -->
  <rect class="sorot" x="120" y="192" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="218">Buat akun super admin</text>
  <text class="isi" x="140" y="240">Jalankan sql/02-seed-super-admin.sql. Ini kunci masuk pertama.</text>

  <path class="alir" d="M430 254 V 276"/>

  <!-- 4 -->
  <rect class="kartu" x="120" y="276" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="302">Isi berkas .env</text>
  <text class="isi mono" x="140" y="324">DATABASE_URL · JWT_SECRET · NEXTAUTH_SECRET</text>

  <path class="alir" d="M430 338 V 360"/>

  <!-- 5 -->
  <rect class="kartu" x="120" y="360" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="386">Uji dulu di laptop</text>
  <text class="isi mono" x="140" y="408">npm run dev, pastikan bisa login</text>

  <path class="alir" d="M430 422 V 444"/>

  <!-- 6 -->
  <rect class="kartu" x="120" y="444" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="470">Salin repositori ke VM</text>
  <text class="isi mono" x="140" y="492">git clone ke /opt/webgis/app</text>

  <path class="alir" d="M430 506 V 528"/>

  <!-- 7 -->
  <rect class="kartu" x="120" y="528" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="554">Hubungkan Cloud Build ke GitHub</text>
  <text class="isi" x="140" y="576">Buat trigger, isi 4 substitution variable</text>

  <path class="alir" d="M430 590 V 612"/>

  <!-- 8 -->
  <rect class="kartu" x="120" y="612" width="620" height="62" rx="8"/>
  <text class="judul" x="140" y="638">git push origin main</text>
  <text class="isi" x="140" y="660">Perintah terakhir yang Anda jalankan</text>

  <path class="alir" d="M430 674 V 696"/>

  <!-- 9, mulai bagian otomatis. Gaya putus menandai bahwa Anda tidak turun tangan lagi. -->
  <rect class="hasil" x="120" y="696" width="620" height="62" rx="8"
        stroke-dasharray="6 4"/>
  <text class="judul" x="140" y="722">Cloud Build bekerja sendiri</text>
  <text class="isi" x="140" y="744">Bangun image, dorong ke Artifact Registry, nyalakan container</text>

  <path class="alir" d="M430 758 V 780"/>

  <rect class="hasil" x="120" y="780" width="620" height="62" rx="8"
        stroke-dasharray="6 4"/>
  <text class="judul" x="140" y="806">Container diperbarui di VM, tanpa Anda masuk ke VM</text>
  <text class="isi" x="140" y="828">Diulang setiap kali push berikutnya</text>

  <path class="alir" d="M430 842 V 864"/>

  <!-- HASIL AKHIR -->
  <rect class="sorot" x="120" y="864" width="620" height="56" rx="8"/>
  <text class="judul" x="140" y="890">Hasil akhir: Geoportal terbit di alamat HTTPS</text>
  <text class="isi" x="140" y="910">Satu alamat melayani dua layanan: Geoportal dan GeoServer</text>
</svg>
